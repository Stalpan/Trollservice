<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.meta.title }}</title>
  <meta name="description" content="{{ t.meta.description }}">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#innehall">{{ t.skip }}</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index' if lang == 'sv' else 'index_en') }}">
        <span class="brand-badge"><img class="brand-mark" src="/logo-mark.png" alt="" width="62" height="59"></span>
        <span class="brand-name">{{ t.brand }}</span>
      </a>

      <nav class="site-nav" aria-label="{{ t.nav_label }}">
        <a href="#tjanster">{{ t.nav.services }}</a>
        <a href="#om-oss">{{ t.nav.about }}</a>
        <a href="#kontakt">{{ t.nav.contact }}</a>
      </nav>

      <div class="lang-switch" role="group" aria-label="{{ t.lang.label }}">
        <a href="{{ url_for('index') }}" class="{% if lang == 'sv' %}is-active{% endif %}" lang="sv" hreflang="sv">SV</a>
        <a href="{{ url_for('index_en') }}" class="{% if lang == 'en' %}is-active{% endif %}" lang="en" hreflang="en">EN</a>
      </div>
    </div>
  </header>

  <main id="innehall">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-badge"><img class="brand-mark" src="/logo-mark.png" alt="" width="40" height="38"></span>
        <span>{{ t.brand }}</span>
      </div>
      <p class="footer-note">{{ t.footer.note }}</p>
      <p class="footer-rights">{{ t.footer.rights }}</p>
    </div>
  </footer>
  {% if not config.get('SERVER_VALIDATION', true) %}
  <script>
    /* Static build: submit to FormSubmit's ajax endpoint and show the page's
       own success message; fall back to a plain POST if fetch fails. */
    document.querySelectorAll('form[data-ajax]').forEach(function (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = f.querySelector('button[type="submit"]');
        var url = f.action.replace('formsubmit.co/', 'formsubmit.co/ajax/');
        if (btn) btn.disabled = true;
        fetch(url, { method: 'POST', body: new FormData(f), headers: { 'Accept': 'application/json' } })
          .then(function (r) {
            if (!r.ok) throw new Error('submit failed');
            var ok = document.querySelector('.alert-ok');
            if (ok) ok.hidden = false;
            f.reset();
          })
          .catch(function () { f.submit(); })
          .then(function () { if (btn) btn.disabled = false; });
      });
    });
  </script>
  {% endif %}
</body>
</html>
